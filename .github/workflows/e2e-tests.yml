name: Testes E2E - Instalador A11y

on:
  push: # Dispara o workflow em pushes para a branch "main".
    branches: [ "main" ]
  pull_request: # Dispara o workflow em pull requests para a branch "main".
    branches: [ "main" ]
  workflow_dispatch: # Permite que o workflow seja disparado manualmente na aba "Actions" do GitHub.

# Definição do Job de Testes E2E
jobs:
  test-windows-installation:
    runs-on: windows-latest
    strategy:
      matrix:
        user_choice: [1, 2]

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Instalação de dependências de build e preparação de dependências binárias
      - name: Instalar Dependências de Build
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller rich psutil

      - name: Preparar Dependências Binárias
        run: |
          New-Item -ItemType Directory -Path "bin" -Force
          $SharpWinUrl = "https://github.com/A11yDevs/emacs-a11y-installer.py/releases/download/deps-v1/SharpWin.exe"
          Invoke-WebRequest -Uri $SharpWinUrl -OutFile "bin\SharpWin.exe"

      # Executa o Script de Build para gerar o instalador
      - name: Executar Script de Build
        env:
          PYTHONIOENCODING: utf8
        run: python scripts/build.py

      # Executa Testes Unitários
      - name: Executar Benchmark de Estresse e Latência
        env:
          PYTHONIOENCODING: utf8
          CI_MOCK_NVDA: "1"
        run: python scripts/benchmark.py

      # Executa o Instalador com a escolha do usuário (1 ou 2)
      - name: Executar o Instalador (Opção ${{ matrix.user_choice }})
        env:
          PYTHONIOENCODING: utf8
        run: |
          Write-Output "${{ matrix.user_choice }}`n`n" | .\dist\installer-a11y.exe

      # Valida a instalação verificando a presença dos arquivos esperados
      - name: Validar Configuração
        env:
          PYTHONIOENCODING: utf8
        run: |
          $EmacsDir = "$env:USERPROFILE\.emacs.d"
          
          if (-Not (Test-Path "$EmacsDir\init.el")) { exit 1 }
          if (-Not (Test-Path "$EmacsDir\emacspeak")) { exit 1 }
          
          if ("${{ matrix.user_choice }}" -eq "1") {
              Write-Host "Validando arquivos da Configuração do Desenvolvedor..."
              if (-Not (Test-Path "$EmacsDir\lisp\init-accessibility.el")) { exit 1 }
              if (-Not (Test-Path "$EmacsDir\SharpWin.exe")) { exit 1 }
          } 
          elseif ("${{ matrix.user_choice }}" -eq "2") {
              Write-Host "Validando arquivos do Leitor de Telas Nativo..."
              if (-Not (Test-Path "$EmacsDir\nvda_server.exe")) { exit 1 }
              
              $Dll32 = Test-Path "$EmacsDir\nvdaControllerClient32.dll"
              $Dll64 = Test-Path "$EmacsDir\nvdaControllerClient64.dll"
              if (-Not ($Dll32 -or $Dll64)) { exit 1 }
          }