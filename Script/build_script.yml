name: Testes E2E - Instalador A11y

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-windows-installation:
    runs-on: windows-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências de Build
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller rich

      - name: Mock de Dependências Binárias
        # Garante que os arquivos esperados existam na raiz para o PyInstaller não falhar.
        # Caso eles já sejam gerados em etapas anteriores do seu CI, você pode omitir este passo.
        run: |
          New-Item -ItemType File -Path "nvda_server.exe" -Force
          New-Item -ItemType File -Path "nvdaControllerClient64.dll" -Force
          New-Item -ItemType File -Path "nvdaControllerClient32.dll" -Force
          New-Item -ItemType File -Path "SharpWin.exe" -Force

      - name: Construir o Instalador
        run: |
          pyinstaller --onefile `
            --add-binary "nvda_server.exe;." `
            --add-binary "nvdaControllerClient64.dll;." `
            --add-binary "nvdaControllerClient32.dll;." `
            --add-binary "SharpWin.exe;." `
            installer-a11y.py

      - name: Executar o Instalador (Simulando Escolha 1)
        run: |
          # Simula o usuário digitando '1' seguido de um 'Enter' para a pausa final
          Write-Output "1`n`n" | .\dist\installer-a11y.exe

      - name: Validar Configuração do Emacs
        run: |
          $EmacsDir = "$env:USERPROFILE\.emacs.d"
          $InitFile = "$EmacsDir\init.el"
          $AccFile = "$EmacsDir\lisp\init-accessibility.el"
          $EmacspeakDir = "$EmacsDir\emacspeak"
          
          # Verifica se os arquivos base foram injetados
          if (-Not (Test-Path $InitFile)) {
              Write-Error "FALHA: init.el não foi criado."
              exit 1
          }
          if (-Not (Test-Path $AccFile)) {
              Write-Error "FALHA: init-accessibility.el não foi gerado."
              exit 1
          }
          
          # Verifica se o repositório do Emacspeak foi clonado
          if (-Not (Test-Path $EmacspeakDir)) {
              Write-Error "FALHA: O repositório do Emacspeak não foi clonado."
              exit 1
          }
          
          # Verifica o conteúdo do init.el
          $InitContent = Get-Content $InitFile -Raw
          if ($InitContent -notmatch "dtk-program") {
               Write-Error "FALHA: O servidor de áudio não foi configurado no init.el."
               exit 1
          }
          
          Write-Host "SUCESSO: A estrutura e os arquivos de configuração foram provisionados corretamente!" -ForegroundColor Green