name: Testes E2E - Instalador A11y

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        user_choice: [1, 2] # 1: Dev Config, 2: Leitor Nativo

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências do Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller rich

      - name: Baixar SharpWin.exe (Dependência Pesada)
        run: |
          # Cria a pasta bin caso ela não exista
          New-Item -ItemType Directory -Path "bin" -Force
          
          # Baixa o SharpWin.exe real da Release no GitHub
          $SharpWinUrl = "https://github.com/A11yDevs/emacs-a11y-installer/releases/download/deps-v1/SharpWin.exe"
          Write-Host "Baixando SharpWin.exe..."
          Invoke-WebRequest -Uri $SharpWinUrl -OutFile "bin\SharpWin.exe"

      - name: Executar Script de Build
        # Chama o script que automatiza o PyInstaller
        run: python scripts/build.py

      - name: Executar Instalador (Simulando Opção ${{ matrix.user_choice }})
        run: |
          # Simula a digitação da opção escolhida e os "Enters"
          Write-Output "${{ matrix.user_choice }}`n`n" | .\dist\installer-a11y.exe

      - name: Validar Configuração Emacs (Arquitetura)
        run: |
          $EmacsDir = "$env:USERPROFILE\.emacs.d"
          
          # Testes base aplicados a todas as configurações
          if (-Not (Test-Path "$EmacsDir\init.el")) { exit 1 }
          if (-Not (Test-Path "$EmacsDir\emacspeak")) { exit 1 }
          
          # Testes específicos por opção
          if ("${{ matrix.user_choice }}" -eq "1") {
              Write-Host "Validando Configuração do Desenvolvedor..." -ForegroundColor Cyan
              if (-Not (Test-Path "$EmacsDir\lisp\init-accessibility.el")) { exit 1 }
              if (-Not (Test-Path "$EmacsDir\SharpWin.exe")) { exit 1 }
              Write-Host "Tudo OK com a Opção 1!" -ForegroundColor Green
          } 
          elseif ("${{ matrix.user_choice }}" -eq "2") {
              Write-Host "Validando Leitor de Telas Nativo (NVDA)..." -ForegroundColor Cyan
              if (-Not (Test-Path "$EmacsDir\nvda_server.exe")) { exit 1 }
              
              # Verifica se a DLL foi extraída corretamente
              $Dll32 = Test-Path "$EmacsDir\nvdaControllerClient32.dll"
              $Dll64 = Test-Path "$EmacsDir\nvdaControllerClient64.dll"
              
              if (-Not ($Dll32 -or $Dll64)) {
                  Write-Error "FALHA: Nenhuma DLL do NVDA Controller Client foi encontrada."
                  exit 1
              }
              Write-Host "Tudo OK com a Opção 2!" -ForegroundColor Green
          }